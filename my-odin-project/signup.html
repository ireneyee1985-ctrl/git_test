<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | The Odin Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Left Side: Hero Branding Banner -->
        <div class="sidebar">
            <div class="logo-container">
                <img src="img/odin-lined.png" alt="Odin Logo" class="logo">
                <span class="logo-text">ODIN</span>
            </div>
            <div class="credits">Photo by Unsplash</div>
        </div>

        <!-- Right Side: The Form Content -->
        <div class="main-content">
            <div class="header-text">
                <p>This is not a real service! You know you want to sign up for something like this because it's awesome.</p>
                <p>Sign up <em>now</em> to get started.</p>
            </div>

            <form action="#" method="post" class="signup-form">
                <h2>Let's do this!</h2>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" name="first_name" required>
                    </div>
                    <div class="input-group">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="last_name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="input-group">
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" required minlength="8">
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" name="confirm_password" required minlength="8">
                    </div>
                </div>

                <div class="submit-section">
                    <button type="submit">Create Account</button>
                    <p class="login-prompt">Already have an account? <a href="#">Log in</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
